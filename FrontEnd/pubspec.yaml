name: carnet_sante_numerique
description: Carnet de santé numérique mobile - UCAC-ICAM
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # API HTTP
  dio: ^5.4.0

  # Stockage sécurisé (tokens JWT)
  flutter_secure_storage: ^9.0.0

  # Biométrie (empreinte / FaceID)
  local_auth: ^2.1.8

  # QR Code (génération + scan)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0

  # Gestion d'état
  flutter_riverpod: ^2.5.0

  # Utilitaires
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true